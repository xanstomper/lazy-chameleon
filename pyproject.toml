[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-chameleon"
version = "2.3.0"
description = "Synthetic parameter generator that turns flash-class LLMs into frontier-grade reasoners at inference time."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["httpx"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
chameleon = "lazy_chameleon.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lazy_chameleon*"]
